<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Animated Blossoming Flowers</title>
    <style>
        :root {
            --dark-color: #000;
            --light-color: #48cae4;
            --flower-color: #90e0ef;
            --leaf-color: #2b9348;
        }

        body {
            background-color: var(--dark-color);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-end;
            overflow: hidden;
            margin: 0;
        }

        .flowers {
            position: relative;
            transform: scale(0.9);
        }

        .flower {
            position: absolute;
            bottom: 10px;
            transform-origin: bottom center;
            animation: opening-flower 2s 1s backwards;
        }

        .flower--1 {
            left: 0;
            transform: rotate(10deg);
        }

        .flower--2 {
            left: 50px;
            transform: rotate(-5deg);
        }

        .flower--3 {
            left: -40px;
            transform: rotate(20deg);
        }

        /* السيقان */
        .flower__line {
            width: 4px;
            height: 200px;
            background-image: linear-gradient(to top, rgba(0,0,0,0.5), #0077b6, #90e0ef);
            border-radius: 4px;
            animation: grow-line 3s backwards;
        }

        /* البتلات */
        .flower__leafs {
            position: relative;
            animation: blooming 2s 2s backwards;
        }

        .flower__leaf {
            position: absolute;
            left: -15px;
            bottom: 0;
            width: 30px;
            height: 60px;
            background-image: linear-gradient(to top, #0077b6, var(--flower-color));
            border-radius: 50% 50% 20% 20%;
            transform-origin: bottom center;
            box-shadow: 0 0 10px rgba(72, 202, 228, 0.5);
        }

        .flower__leaf--1 { transform: rotate(-45deg); }
        .flower__leaf--2 { transform: rotate(-15deg); }
        .flower__leaf--3 { transform: rotate(15deg); }
        .flower__leaf--4 { transform: rotate(45deg); }

        /* مركز الزهرة الأبيض */
        .flower__white-circle {
            position: absolute;
            left: -8px;
            bottom: 35px;
            width: 16px;
            height: 16px;
            background-color: #fff;
            border-radius: 50%;
            box-shadow: 0 0 15px #fff, 0 0 25px var(--light-color);
        }

        /* الأنوار المتطايرة */
        .flower__light {
            position: absolute;
            width: 6px;
            height: 6px;
            background-color: var(--light-color);
            border-radius: 50%;
            box-shadow: 0 0 10px var(--light-color);
            animation: light-up 3s infinite ease-in-out;
        }

        .flower__light--1 { top: 50px; left: -20px; animation-delay: 0.5s; }
        .flower__light--2 { top: 30px; left: 20px; animation-delay: 1s; }
        .flower__light--3 { top: 80px; left: 30px; animation-delay: 1.5s; }

        /* الأنيميشن والحركات */
        @keyframes grow-line {
            0% {
                height: 0;
            }
            100% {
                height: 200px;
            }
        }

        @keyframes blooming {
            0% {
                transform: scale(0);
            }
            100% {
                transform: scale(1);
            }
        }

        @keyframes light-up {
            0%, 100% {
                opacity: 0.2;
                transform: scale(0.8);
            }
            50% {
                opacity: 1;
                transform: scale(1.2);
            }
        }
    </style>
</head>
<body>

    <div class="flowers">
        <!-- الزهرة الأولى -->
        <div class="flower flower--1">
            <div class="flower__line"></div>
            <div class="flower__leafs">
                <div class="flower__leaf flower__leaf--1"></div>
                <div class="flower__leaf flower__leaf--2"></div>
                <div class="flower__leaf flower__leaf--3"></div>
                <div class="flower__leaf flower__leaf--4"></div>
                <div class="flower__white-circle"></div>
            </div>
            <div class="flower__light flower__light--1"></div>
            <div class="flower__light flower__light--2"></div>
        </div>

        <!-- الزهرة الثانية -->
        <div class="flower flower--2">
            <div class="flower__line" style="height: 230px;"></div>
            <div class="flower__leafs">
                <div class="flower__leaf flower__leaf--1"></div>
                <div class="flower__leaf flower__leaf--2"></div>
                <div class="flower__leaf flower__leaf--3"></div>
                <div class="flower__leaf flower__leaf--4"></div>
                <div class="flower__white-circle"></div>
            </div>
            <div class="flower__light flower__light--3"></div>
        </div>

        <!-- الزهرة الثالثة -->
        <div class="flower flower--3">
            <div class="flower__line" style="height: 170px;"></div>
            <div class="flower__leafs">
                <div class="flower__leaf flower__leaf--1"></div>
                <div class="flower__leaf flower__leaf--2"></div>
                <div class="flower__leaf flower__leaf--3"></div>
                <div class="flower__leaf flower__leaf--4"></div>
                <div class="flower__white-circle"></div>
            </div>
            <div class="flower__light flower__light--1"></div>
        </div>
    </div>

</body>
</html>
