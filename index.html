<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لعبة المرور من الأنابيب</title>
    <style>
        body {
            margin: 0;
            background-color: #222;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            font-family: Arial, sans-serif;
            touch-action: manipulation;
        }

        canvas {
            border: 4px solid #fff;
            box-shadow: 0 0 20px rgba(0,0,0,0.8);
            background: linear-gradient(to bottom, #4ec0ca, #fff);
            cursor: pointer;
        }
    </style>
</head>
<body>

    <canvas id="gameCanvas" width="400" height="600"></canvas>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");

        // إعدادات الطائر
        let bird = {
            x: 50,
            y: 150,
            width: 30,
            height: 24,
            gravity: 0.6,
            lift: -10,
            velocity: 0
        };

        // إعدادات الأنابيب
        let pipes = [];
        let pipeWidth = 60;
        let pipeGap = 160;
        let pipeSpeed = 3;
        let frameCount = 0;
        let score = 0;
        let isGameOver = false;
        let gameStarted = false;

        // التحكم باللمس أو النقر
        function jump() {
            if (!gameStarted) {
                gameStarted = true;
            }
            if (isGameOver) {
                resetGame();
            } else {
                bird.velocity = bird.lift;
            }
        }

        window.addEventListener("keydown", function(e) {
            if (e.code === "Space" || e.code === "ArrowUp") {
                jump();
            }
        });

        canvas.addEventListener("click", jump);

        function resetGame() {
            bird.y = 150;
            bird.velocity = 0;
            pipes = [];
            score = 0;
            frameCount = 0;
            isGameOver = false;
            gameStarted = true;
        }

        function createPipe() {
            let minHeight = 50;
            let maxHeight = canvas.height - pipeGap - 100;
            let height = Math.floor(Math.random() * (maxHeight - minHeight + 1)) + minHeight;

            pipes.push({
                x: canvas.width,
                top: height,
                bottom: canvas.height - height - pipeGap,
                passed: false
            });
        }

        function update() {
            if (!gameStarted) return;

            if (!isGameOver) {
                bird.velocity += bird.gravity;
                bird.y += bird.velocity;

                // إنشاء أنابيب جديدة
                if (frameCount % 90 === 0) {
                    createPipe();
                }

                // تحريك وحذف الأنابيب
                for (let i = pipes.length - 1; i >= 0; i--) {
                    pipes[i].x -= pipeSpeed;

                    // حساب النقاط
                    if (!pipes[i].passed && pipes[i].x + pipeWidth < bird.x) {
                        score++;
                        pipes[i].passed = true;
                    }

                    // كشف الاصطدام
                    if (
                        bird.x < pipes[i].x + pipeWidth &&
                        bird.x + bird.width > pipes[i].x &&
                        (bird.y < pipes[i].top || bird.y + bird.height > canvas.height - pipes[i].bottom)
                    ) {
                        isGameOver = true;
                    }

                    // إزالة الأنابيب التي خرجت من الشاشة
                    if (pipes[i].x + pipeWidth < 0) {
                        pipes.splice(i, 1);
                    }
                }

                // اصطدام الطائر بالأرض أو السقف
                if (bird.y + bird.height >= canvas.height || bird.y <= 0) {
                    isGameOver = true;
                }

                frameCount++;
            }
        }

        function draw() {
            // مسح الشاشة
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // رسم الأنابيب
            ctx.fillStyle = "#73bf2e";
            ctx.strokeStyle = "#558022";
            ctx.lineWidth = 3;
            for (let i = 0; i < pipes.length; i++) {
                // الأنبوب العلوي
                ctx.fillRect(pipes[i].x, 0, pipeWidth, pipes[i].top);
                ctx.strokeRect(pipes[i].x, 0, pipeWidth, pipes[i].top);

                // الأنبوب السفلي
                ctx.fillRect(pipes[i].x, canvas.height - pipes[i].bottom, pipeWidth, pipes[i].bottom);
                ctx.strokeRect(pipes[i].x, canvas.height - pipes[i].bottom, pipeWidth, pipes[i].bottom);
            }

            // رسم الطائر
            ctx.fillStyle = "#f8e71c";
            ctx.strokeStyle = "#d0021b";
            ctx.lineWidth = 2;
            ctx.fillRect(bird.x, bird.y, bird.width, bird.height);
            ctx.strokeRect(bird.x, bird.y, bird.width, bird.height);

            // رسم عين الطائر
            ctx.fillStyle = "#000";
            ctx.fillRect(bird.x + 18, bird.y + 5, 5, 5);

            // رسم النقاط
            ctx.fillStyle = "#fff";
            ctx.font = "bold 35px Arial";
            ctx.textAlign = "center";
            ctx.fillText(score, canvas.width / 2, 60);

            // رسالة البداية أو النهاية
            if (!gameStarted) {
                ctx.fillStyle = "rgba(0, 0, 0, 0.4)";
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.fillStyle = "#fff";
                ctx.font = "bold 25px Arial";
                ctx.fillText("اضغط أو المس الشاشة للبدء", canvas.width / 2, canvas.height / 2);
            } else if (isGameOver) {
                ctx.fillStyle = "rgba(0, 0, 0, 0.5)";
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.fillStyle = "#fff";
                ctx.font = "bold 30px Arial";
                ctx.fillText("انتهت اللعبة!", canvas.width / 2, canvas.height / 2 - 20);
                ctx.font = "bold 20px Arial";
                ctx.fillText("اضغط لإعادة المحاولة", canvas.width / 2, canvas.height / 2 + 30);
            }
        }

        function loop() {
            update();
            draw();
            requestAnimationFrame(loop);
        }

        loop();
    </script>
</body>
</html>
