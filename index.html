<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Animated Flowers</title>
    <style>
        *, *::after, *::before {
            padding: 0;
            margin: 0;
            box-sizing: border-box;
        }

        :root {
            --dark-color: #000;
            --light-color: #48cae4;
            --flower-color: #90e0ef;
        }

        body {
            background-color: var(--dark-color);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-end;
            overflow: hidden;
            perspective: 1000px;
        }

        .night {
            position: fixed;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-image: radial-gradient(ellipse at top, transparent 0%, var(--dark-color)), radial-gradient(circle at bottom, #1b263b 0%, var(--dark-color));
            z-index: 1;
        }

        .flowers {
            position: relative;
            transform: scale(1.2);
            z-index: 2;
        }

        .flower {
            position: absolute;
            bottom: 10vh;
            transform-origin: bottom center;
            z-index: 10;
        }

        .flower--1 {
            animation: moving-flower-1 4s linear infinite;
        }

        .flower__leafs {
            position: relative;
            animation: blooming-flower 2s backwards;
        }

        .flower__leaf {
            position: absolute;
            bottom: 0;
            left: 50%;
            width: 40px;
            height: 80px;
            background-image: linear-gradient(to top, #0077b6, var(--flower-color));
            border-radius: 50% 50% 20% 20%;
            transform-origin: bottom center;
            transform: translateX(-50%);
            box-shadow: inset 0 0 15px rgba(255, 255, 255, 0.5);
        }

        .flower__leaf--1 { transform: translateX(-50%) rotate(-40deg); }
        .flower__leaf--2 { transform: translateX(-50%) rotate(-10deg); }
        .flower__leaf--3 { transform: translateX(-50%) rotate(20deg); }
        .flower__leaf--4 { transform: translateX(-50%) rotate(50deg); }

        .flower__white-circle {
            position: absolute;
            left: 50%;
            bottom: 60px;
            transform: translateX(-50%);
            width: 25px;
            height: 25px;
            background-color: #fff;
            border-radius: 50%;
            box-shadow: 0 0 20px #fff, 0 0 35px var(--light-color);
        }

        /* الإضاءات المتطايرة */
        .flower__light {
            position: absolute;
            width: 6px;
            height: 6px;
            background-color: var(--light-color);
            border-radius: 50%;
            box-shadow: 0 0 10px var(--light-color);
            animation: light-ani 3s infinite ease-in-out;
        }

        .flower__light--1 { top: -20px; left: -30px; animation-delay: 0.2s; }
        .flower__light--2 { top: -40px; left: 10px; animation-delay: 0.5s; }
        .flower__light--3 { top: -10px; left: 40px; animation-delay: 0.8s; }
        .flower__light--4 { top: -50px; left: -10px; animation-delay: 1.1s; }
        .flower__light--5 { top: -30px; left: 30px; animation-delay: 1.4s; }
        .flower__light--6 { top: -60px; left: -20px; animation-delay: 1.7s; }
        .flower__light--7 { top: -45px; left: 20px; animation-delay: 2s; }

        @keyframes moving-flower-1 {
            0%, 100% { transform: rotate(2deg); }
            50% { transform: rotate(-2deg); }
        }

        @keyframes blooming-flower {
            0% { transform: scale(0); }
            100% { transform: scale(1); }
        }

        @keyframes light-ani {
            0%, 100% { opacity: 0.2; transform: scale(0.8); }
            50% { opacity: 1; transform: scale(1.3); }
        }
    </style>
</head>
<body class="not-loaded">
    <div class="night"></div>
    <div class="flowers">
        <div class="flower flower--1">
            <div class="flower__leafs flower__leafs--1">
                <div class="flower__leaf flower__leaf--1"></div>
                <div class="flower__leaf flower__leaf--2"></div>
                <div class="flower__leaf flower__leaf--3"></div>
                <div class="flower__leaf flower__leaf--4"></div>
                <div class="flower__white-circle"></div>
            </div>
            
            <div class="flower__light flower__light--1"></div>
            <div class="flower__light flower__light--2"></div>
            <div class="flower__light flower__light--3"></div>
            <div class="flower__light flower__light--4"></div>
            <div class="flower__light flower__light--5"></div>
            <div class="flower__light flower__light--6"></div>
            <div class="flower__light flower__light--7"></div>
        </div>
    </div>
</body>
</html>
